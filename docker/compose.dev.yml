services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      APP_KEY: base64:REPLACE_WITH_PHP_ARTISAN_KEY_GENERATE
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: minecraft_stats
      DB_USERNAME: minecraft_stats
      DB_PASSWORD: minecraft_stats
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: minecraft_stats
      POSTGRES_USER: minecraft_stats
      POSTGRES_PASSWORD: minecraft_stats
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minecraft_stats -d minecraft_stats"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
