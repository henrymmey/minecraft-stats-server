name: Server CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: minecraft_stats
          POSTGRES_PASSWORD: minecraft_stats
          POSTGRES_DB: minecraft_stats_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U minecraft_stats -d minecraft_stats_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, dom, curl, fileinfo, pgsql, pdo_pgsql
          coverage: none

      - name: Validate Composer
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: minecraft_stats_test
          DB_USERNAME: minecraft_stats
          DB_PASSWORD: minecraft_stats
        run: php artisan test
